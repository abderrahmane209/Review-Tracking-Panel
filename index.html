<title>لوحة تتبع المراجعة</title>
<meta name="description" content="Suivi quotidien des révisions pour le Bac 2 Sciences Physiques / لوحة تتبع المراجعة اليومية لثانية باكالوريا علوم فيزيائية">
<meta name="theme-color" content="#2563eb">
<meta property="og:title" content="Suivi de révision - 2 Bac SP / تتبع المراجعة">
<meta property="og:description" content="Heures d'étude, concentration et énergie, avec graphiques de progression. / ساعات المراجعة والتركيز والطاقة مع رسوم التطور.">

<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --text:#1e293b; --muted:#64748b;
    --border:#e2e8f0; --primary:#2563eb; --primary-soft:#dbeafe;
    --good:#16a34a; --bad:#dc2626; --warn:#d97706; --grid:rgba(100,116,139,.18);
    --shadow:0 2px 10px rgba(15,23,42,.06); --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
      --border:#334155; --primary:#3b82f6; --primary-soft:#1e3a8a;
      --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --grid:rgba(148,163,184,.18);
      --shadow:0 2px 10px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    padding:12px; padding-bottom:90px;
  }
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--primary);outline-offset:2px}
  .wrap{max-width:1100px;margin:0 auto}

  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:1.3rem;font-weight:800}
  .sub{color:var(--muted);font-size:.8rem}
  .header-side{display:flex;gap:10px;align-items:stretch}
  .countdown{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:8px 16px;text-align:center;box-shadow:var(--shadow);min-width:110px;
  }
  .countdown b{display:block;font-size:1.6rem;color:var(--primary);line-height:1.2}
  .countdown span{font-size:.72rem;color:var(--muted);display:block;max-width:150px}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  @media(min-width:720px){.cards{grid-template-columns:repeat(4,1fr)}}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;box-shadow:var(--shadow);
  }
  .card .lbl{font-size:.75rem;color:var(--muted)}
  .card .val{font-size:1.4rem;font-weight:800;margin-top:2px}
  .trend-up{color:var(--good);font-size:.75rem;font-weight:700}
  .trend-down{color:var(--bad);font-size:.75rem;font-weight:700}
  .trend-same{color:var(--muted);font-size:.75rem}

  .section{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .section h2{font-size:1rem;margin-bottom:10px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{
    border:1px solid var(--border);background:transparent;
    padding:6px 14px;border-radius:999px;font-size:.8rem;cursor:pointer;
  }
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .date-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .date-row input[type=date], .field input[type=date]{
    padding:9px 10px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);
  }
  .badge{
    background:var(--primary-soft);color:var(--primary);border-radius:999px;
    padding:2px 12px;font-size:.78rem;font-weight:700;
  }
  @media(prefers-color-scheme:dark){.badge{color:#bfdbfe}}

  .subject-row{
    display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;
    border:1px solid var(--border);margin-bottom:8px;flex-wrap:wrap;
  }
  .subject-row .name{flex:1 1 120px;font-weight:600;font-size:.9rem}
  .subject-row input[type=number]{
    width:72px;padding:8px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);text-align:center;
  }
  .unit{color:var(--muted);font-size:.75rem}
  .quick{
    background:var(--primary-soft);color:var(--primary);border:none;border-radius:10px;
    padding:8px 10px;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  @media(prefers-color-scheme:dark){.quick{color:#bfdbfe}}
  .quick:active{transform:scale(.96)}
  .icon-btn{
    background:transparent;border:1px solid var(--border);border-radius:8px;
    padding:6px 9px;cursor:pointer;color:var(--muted);font-size:.8rem;
  }
  .icon-btn:hover{color:var(--primary);border-color:var(--primary)}
  .icon-btn.danger:hover{color:var(--bad);border-color:var(--bad)}
  .total-line{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;font-weight:700}

  .scale{display:flex;gap:6px;margin:6px 0 2px}
  .scale button{
    flex:1;min-width:44px;padding:12px 0;border-radius:12px;border:1px solid var(--border);
    background:var(--bg);font-weight:700;font-size:1rem;cursor:pointer;
  }
  .scale button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
  textarea{
    width:100%;min-height:60px;padding:10px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg);resize:vertical;
  }
  .primary-btn{
    width:100%;padding:14px;border-radius:14px;border:none;background:var(--primary);color:#fff;
    font-size:1rem;font-weight:800;cursor:pointer;
  }
  .primary-btn:active{opacity:.85}
  .ghost-btn{
    padding:9px 14px;border-radius:12px;border:1px solid var(--border);background:transparent;
    font-size:.85rem;cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--primary)}
  .ghost-btn.danger{color:var(--bad)}
  .ghost-btn.danger:hover{border-color:var(--bad)}

  .charts{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:900px){.charts{grid-template-columns:1fr 1fr}}
  .charts .section{margin-bottom:0}
  .chart-box{position:relative;height:240px}
  .empty{
    text-align:center;color:var(--muted);font-size:.85rem;padding:24px 8px;
    border:1px dashed var(--border);border-radius:12px;
  }

  .history-item{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;font-size:.85rem;
  }
  .history-item .info{flex:1;min-width:0}
  .history-item .date{font-weight:700}
  .history-item .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}
  .history-item .note{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .history-item .actions{display:flex;gap:6px}

  .row{display:flex;gap:8px;flex-wrap:wrap}
  .privacy{margin-top:12px;color:var(--muted);font-size:.78rem}
  footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:20px}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);
    background:var(--text);color:var(--bg);padding:10px 20px;border-radius:12px;
    font-size:.85rem;font-weight:600;transition:transform .3s;z-index:99;max-width:90vw;text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>

      <div class="sub" data-i18n="tagline"></div>
    </div>

    <div class="card"><div class="lbl" data-i18n="lblFocus"></div><div class="val" id="statFocus">—</div></div>
    <div class="card">
      <div class="lbl" data-i18n="lblCompare"></div>
      <div class="val" id="statCompare">—</div>
      <div id="statTrend"></div>
    </div>
  </div>

  <!-- نموذج الإدخال / Saisie -->
  <div class="section" id="formSection">
    <h2 data-i18n="logTitle"></h2>
    <div class="date-row">
      <label for="dateInput" class="sub" data-i18n="dateLbl"></label>
      <input type="date" id="dateInput">
      <button class="ghost-btn" id="todayBtn" type="button" data-i18n="backToday" hidden></button>
      <span class="badge" id="editBadge" hidden></span>
    </div>
    <div id="subjectInputs"></div>
    <div class="total-line">
      <button class="ghost-btn" id="addSubjectBtn" type="button" data-i18n="addSubject"></button>
      <span><span data-i18n="dayTotal"></span> <span id="dayTotal">0</span></span>
    </div>

    <div class="field">
      <label data-i18n="focusLbl"></label>
      <div class="scale" id="focusScale" role="group"></div>
    </div>
    <div class="field">
      <label data-i18n="energyLbl"></label>
      <div class="scale" id="energyScale" role="group"></div>
      <div class="sub" data-i18n="scaleHint" style="margin-top:4px"></div>
    </div>
    <div class="field">
      <label for="noteInput" data-i18n="noteLbl"></label>
      <textarea id="noteInput" maxlength="500" data-i18n-ph="notePh"></textarea>
    </div>
    <button class="primary-btn" id="saveBtn" type="button" data-i18n="saveDay"></button>
  </div>

  <div class="filters" id="periodFilter">
    <button class="chip active" type="button" data-days="7" data-i18n="p7"></button>
    <button class="chip" type="button" data-days="30" data-i18n="p30"></button>
    <button class="chip" type="button" data-days="0" data-i18n="pAll"></button>
  </div>

  <div class="charts">
    <div class="section">
      <h2 data-i18n="ch1"></h2>
      <div class="chart-box"><canvas id="lineChart"></canvas></div>
      <div class="empty" id="emptyLine" hidden></div>
    </div>

    <div class="section">
      <h2 data-i18n="ch2"></h2>
      <div class="filters" id="distFilter">
        <button class="chip active" type="button" data-dist="week" data-i18n="distWeek"></button>
        <button class="chip" type="button" data-dist="month" data-i18n="distMonth"></button>
      </div>
      <div class="chart-box"><canvas id="barChart"></canvas></div>
      <div class="empty" id="emptyBar" hidden></div>
    </div>

    <div class="section">
      <h2 data-i18n="ch3"></h2>
      <div class="chart-box"><canvas id="dualChart"></canvas></div>
      <div class="empty" id="emptyDual" hidden></div>
    </div>

    <div class="section">
      <h2 data-i18n="ch4"></h2>
      <div class="chart-box"><canvas id="scatterChart"></canvas></div>
      <div class="empty" id="emptyScatter" hidden></div>
    </div>
  </div>

  <div class="section" style="margin-top:14px">
    <h2 data-i18n="histTitle"></h2>
    <div id="historyList"></div>
  </div>

  <div class="section">
    <h2 data-i18n="settings"></h2>
    <div class="field">
      <label for="examDateInput" data-i18n="examDate"></label>
      <input type="date" id="examDateInput">
    </div>
    <div class="row">
      <button class="ghost-btn" id="exportBtn" type="button" data-i18n="exportBtn"></button>
      <button class="ghost-btn" id="importBtn" type="button" data-i18n="importBtn"></button>
      <button class="ghost-btn danger" id="resetBtn" type="button" data-i18n="resetBtn"></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="privacy" data-i18n="privacy"></p>
  </div>

  <footer data-i18n="footer"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

/* ================= الحالة / État ================= */
var state;
var selectedDate;
var lastToday;
var currentPeriod = 7;
var distMode = 'week';
var charts = {};
var memStore = {};
var storageWarned = false;
var timers = {};

function $(id){ return document.getElementById(id); }
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
function t(k, vars){
  var dict = I18N[state ? state.lang : 'fr'] || I18N.fr;
  var s = dict[k];
  if(s === undefined) s = I18N.fr[k];
  if(s === undefined) s = k;
  if(vars){ for(var x in vars){ s = s.split('{'+x+'}').join(vars[x]); } }
  return s;
}

/* ---------- التخزين (آمن) ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return memStore[k] || null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ memStore[k] = v; return false; } }
function saveState(){
  if(!lsSet(STORAGE_KEY, JSON.stringify(state)) && !storageWarned){
    storageWarned = true; toast(t('storageFail'));
  }
}
function debounce(name, fn, ms){ clearTimeout(timers[name]); timers[name] = setTimeout(fn, ms); }

/* ---------- التواريخ ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ var p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function utcOf(k){ var p = k.split('-').map(Number); return Date.UTC(p[0], p[1]-1, p[2]); }
function addDays(k, n){ var d = parseKey(k); d.setDate(d.getDate()+n); return toKey(d); }
function todayKey(){ return toKey(new Date()); }
function daysBetween(a, b){ return Math.round((utcOf(b)-utcOf(a))/864e5); }
function isKey(k){ return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && toKey(parseKey(k)) === k; }
function lastDates(n){ var out = [], tk = todayKey(); for(var i=n-1;i>=0;i--) out.push(addDays(tk,-i)); return out; }
function periodDates(){
  if(currentPeriod > 0) return lastDates(currentPeriod);
  var keys = Object.keys(state.days).sort();
  if(!keys.length) return [];
  var n = daysBetween(keys[0], todayKey()) + 1;
  return lastDates(Math.max(1, Math.min(n, 366)));
}
function fmtShort(k){ var p = k.split('-'); return p[2]+'/'+p[1]; }
function fmtLong(k){
  try{
    return parseKey(k).toLocaleDateString(state.lang === 'fr' ? 'fr-FR' : 'ar-MA-u-nu-latn',
      {weekday:'long', day:'numeric', month:'long'});
  }catch(e){ return k; }
}

/* ---------- الأرقام ---------- */
function round2(n){ return Math.round(n*100)/100; }
function fmtDur(min){
  min = Math.round(min || 0);
  if(min < 60) return min + (state.lang === 'fr' ? ' min' : t('minShort'));
  var h = Math.floor(min/60), r = min % 60;
  return h + t('hU') + (r ? pad(r) : '');
}

/* ---------- الأيام ---------- */
function dayMin(d){
  if(!d || !d.m) return 0;
  var s = 0; for(var id in d.m) s += d.m[id] || 0; return s;
}
function isEmptyDay(d){
  return !d || (!Object.keys(d.m).length && !d.focus && !d.energy && !d.note);
}
function getDay(k){ return state.days[k] || null; }
function ensureDay(k){
  if(!state.days[k]) state.days[k] = {m:{}, focus:null, energy:null, note:''};
  return state.days[k];
}
function pruneDay(k){ if(state.days[k] && isEmptyDay(state.days[k])) delete state.days[k]; }

/* ---------- المواد ---------- */
function subjName(s){ return s.name || t('subj_'+s.id); }
function newSubjectId(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

/* ================= الحالة الأولية والتحقق ================= */
function detectLang(){
  var l = (navigator.language || '').toLowerCase();
  return l.indexOf('fr') === 0 ? 'fr' : 'ar';
}
function freshState(lang){
  return {v:2, lang: lang || detectLang(), subjects: DEFAULT_IDS.map(function(id){ return {id:id}; }), days:{}, examDate:null};
}
function sanitize(p, lang){
  var out = freshState(lang);
  if(!p || typeof p !== 'object') return out;
  if(!lang && (p.lang === 'fr' || p.lang === 'ar')) out.lang = p.lang;
  if(Array.isArray(p.subjects)){
    var seen = {}, subs = [];
    p.subjects.forEach(function(s){
      if(!s || typeof s.id !== 'string' || subs.length >= MAX_SUBJECTS) return;
      var raw = s.id.replace(/[^\w-]/g,'').slice(0,40);
      var id = mapId(raw);
      if(!id || seen[id]) return;
      if(id !== raw) s = {id:id};
      seen[id] = true;
      var o = {id:id};
      if(typeof s.name === 'string' && s.name.trim()) o.name = s.name.trim().slice(0,40);
      else if(DEFAULT_IDS.indexOf(id) === -1) o.name = id;
      subs.push(o);
    });
    if(subs.length) out.subjects = subs;
  }
  var ids = {}; out.subjects.forEach(function(s){ ids[s.id] = true; });
  if(p.days && typeof p.days === 'object'){
    Object.keys(p.days).forEach(function(k){
      var d = p.days[k];
      if(!isKey(k) || !d || typeof d !== 'object') return;
      var day = {m:{}, focus:null, energy:null, note:''};
      if(d.m && typeof d.m === 'object'){
        Object.keys(d.m).forEach(function(rawId){
          var id = mapId(rawId);
          if(!id || !ids[id]) return;
          var v = Math.round(Number(d.m[rawId]));
          if(v > 0) day.m[id] = Math.min((day.m[id] || 0) + v, MAX_MIN);
        });
      }
      var f = Math.round(Number(d.focus)); if(f >= 1 && f <= 5) day.focus = f;
      var e = Math.round(Number(d.energy)); if(e >= 1 && e <= 5) day.energy = e;
      if(typeof d.note === 'string') day.note = d.note.slice(0,500);
      if(!isEmptyDay(day)) out.days[k] = day;
    });
  }
  if(isKey(p.examDate)) out.examDate = p.examDate;
  return out;
}
function loadState(){
  var parsed = null;
  try{ var raw = lsGet(STORAGE_KEY); if(raw) parsed = JSON.parse(raw); }catch(e){ parsed = null; }
  return sanitize(parsed);
}

/* ================= واجهة عامة ================= */
function toast(msg){
  var tt = $('toast');
  tt.textContent = msg; tt.classList.add('show');
  clearTimeout(tt._t); tt._t = setTimeout(function(){ tt.classList.remove('show'); }, 2600);
}
function applyLang(){
  var L = state.lang;
  document.documentElement.lang = L;
  document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr';
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(function(n){ n.textContent = t(n.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(n){ n.placeholder = t(n.getAttribute('data-i18n-ph')); });
  $('langBtn').textContent = L === 'ar' ? 'Français' : 'العربية';
  $('langBtn').setAttribute('lang', L === 'ar' ? 'fr' : 'ar');
}

/* ================= العد التنازلي ================= */
function renderCountdown(){
  var days = $('countdownDays'), lbl = $('countdownLbl');
  if(!state.examDate){ days.textContent = '—'; lbl.textContent = t('countdownUnset'); return; }
  days.textContent = Math.max(0, daysBetween(todayKey(), state.examDate));
  lbl.textContent = t('countdownLbl');
}

/* ================= نموذج الإدخال ================= */
function renderForm(){
  var tk = todayKey();
  $('dateInput').value = selectedDate;
  $('dateInput').max = tk;
  var isToday = selectedDate === tk;
  $('todayBtn').hidden = isToday;
  $('editBadge').hidden = isToday;
  if(!isToday) $('editBadge').textContent = t('editingDay', {d: fmtLong(selectedDate)});

  var box = $('subjectInputs');
  box.textContent = '';
  var day = getDay(selectedDate);
  state.subjects.forEach(function(s){ box.appendChild(buildSubjectRow(s, day)); });
  updateDayTotal();
  renderScales();
  $('noteInput').value = day ? day.note : '';
}

function buildSubjectRow(s, day){
  var row = el('div', 'subject-row');
  var name = subjName(s);
  row.appendChild(el('span', 'name', name));

  var inp = el('input');
  inp.type = 'number'; inp.min = 0; inp.max = MAX_MIN; inp.step = 5;
  inp.setAttribute('inputmode', 'numeric');
  inp.placeholder = '0';
  inp.value = day && day.m[s.id] ? day.m[s.id] : '';
  inp.setAttribute('aria-label', name + ' (' + t('minUnit') + ')');
  inp.addEventListener('input', function(){
    var v = parseInt(inp.value, 10);
    if(isNaN(v) || v < 0) v = 0;
    if(v > MAX_MIN){ v = MAX_MIN; inp.value = v; }
    setMinutes(s.id, v);
  });
  row.appendChild(inp);
  row.appendChild(el('span', 'unit', t('minUnit')));

  [30, 60].forEach(function(inc){
    var b = el('button', 'quick', '+' + inc);
    b.type = 'button';
    b.setAttribute('aria-label', name + ' +' + inc + ' ' + t('minUnit'));
    b.addEventListener('click', function(){
      var d = getDay(selectedDate);
      var cur = d && d.m[s.id] ? d.m[s.id] : 0;
      var v = Math.min(MAX_MIN, cur + inc);
      inp.value = v; setMinutes(s.id, v);
    });
    row.appendChild(b);
  });

  var ren = el('button', 'icon-btn', '\u270E');
  ren.type = 'button'; ren.title = t('rename'); ren.setAttribute('aria-label', t('rename') + ': ' + name);
  ren.addEventListener('click', function(){ renameSubject(s); });
  row.appendChild(ren);

  var rm = el('button', 'icon-btn danger', '\u2715');
  rm.type = 'button'; rm.title = t('removeSubject'); rm.setAttribute('aria-label', t('removeSubject') + ': ' + name);
  rm.addEventListener('click', function(){ removeSubject(s); });
  row.appendChild(rm);
  return row;
}

function setMinutes(id, v){
  var d = ensureDay(selectedDate);
  if(v > 0) d.m[id] = v; else delete d.m[id];
  commit();
  updateDayTotal();
}
function commit(){
  pruneDay(selectedDate);
  saveState();
  debounce('dash', renderDashboard, 200);
}
function updateDayTotal(){ $('dayTotal').textContent = fmtDur(dayMin(getDay(selectedDate))); }

function buildScale(wrapId, field){
  var wrap = $(wrapId);
  wrap.textContent = '';
  var d = getDay(selectedDate);
  var cur = d ? d[field] : null;
  wrap.setAttribute('aria-label', t(field === 'focus' ? 'focusLbl' : 'energyLbl'));
  for(var i=1;i<=5;i++){
    (function(n){
      var b = el('button', n === cur ? 'active' : '', String(n));
      b.type = 'button';
      b.setAttribute('aria-pressed', n === cur ? 'true' : 'false');
      b.addEventListener('click', function(){
        var day = ensureDay(selectedDate);
        day[field] = day[field] === n ? null : n;
        commit();
        buildScale(wrapId, field);
      });
      wrap.appendChild(b);
    })(i);
  }
}
function renderScales(){ buildScale('focusScale','focus'); buildScale('energyScale','energy'); }

function renameSubject(s){
  var v = prompt(t('renamePrompt'), subjName(s));
  if(v === null) return;
  v = v.trim().slice(0,40);
  if(!v){
    if(DEFAULT_IDS.indexOf(s.id) !== -1) delete s.name; else return;
  } else { s.name = v; }
  saveState(); renderForm(); renderDashboard();
}
function removeSubject(s){
  if(state.subjects.length <= 1){ toast(t('keepOne')); return; }
  if(!confirm(t('removeSubjectConfirm', {s: subjName(s)}))) return;
  state.subjects = state.subjects.filter(function(x){ return x.id !== s.id; });
  Object.keys(state.days).forEach(function(k){ delete state.days[k].m[s.id]; pruneDay(k); });
  saveState(); renderForm(); renderDashboard();
}
function addSubject(){
  if(state.subjects.length >= MAX_SUBJECTS){ toast(t('subjectLimit', {n: MAX_SUBJECTS})); return; }
  var v = prompt(t('newSubjectPrompt'));
  if(v === null) return;
  v = v.trim().slice(0,40);
  if(!v) return;
  var exists = state.subjects.some(function(s){ return subjName(s).toLowerCase() === v.toLowerCase(); });
  if(exists){ toast(t('subjectExists')); return; }
  state.subjects.push({id:newSubjectId(), name:v});
  saveState(); renderForm(); renderDashboard();
}

/* ================= الملخص ================= */
function renderSummary(){
  var tk = todayKey();
  $('statToday').textContent = fmtDur(dayMin(getDay(tk)));

  var wk = lastDates(7);
  var weekMin = wk.reduce(function(a,k){ return a + dayMin(getDay(k)); }, 0);
  $('statWeek').textContent = fmtDur(weekMin);

  var fs = wk.map(function(k){ var d = getDay(k); return d && d.focus; }).filter(Boolean);
  $('statFocus').textContent = fs.length ? String(round2(fs.reduce(function(a,b){ return a+b; }, 0)/fs.length)) : '—';

  var prev = lastDates(14).slice(0,7);
  var prevMin = prev.reduce(function(a,k){ return a + dayMin(getDay(k)); }, 0);
  var cmp = $('statCompare'), tr = $('statTrend');
  tr.textContent = ''; tr.className = '';
  if(!weekMin && !prevMin){ cmp.textContent = '—'; return; }
  cmp.textContent = fmtDur(weekMin);
  var diff = weekMin - prevMin;
  if(diff > 0){ tr.className = 'trend-up'; tr.textContent = '\u25B2 ' + t('trendUp', {x: fmtDur(diff)}); }
  else if(diff < 0){ tr.className = 'trend-down'; tr.textContent = '\u25BC ' + t('trendDown', {x: fmtDur(-diff)}); }
  else { tr.className = 'trend-same'; tr.textContent = t('trendSame'); }
}

/* ================= الرسوم البيانية ================= */
function colors(){
  var cs = getComputedStyle(document.documentElement);
  function g(n){ return cs.getPropertyValue(n).trim(); }
  return {text:g('--text'), grid:g('--grid'), primary:g('--primary'), good:g('--good'), warn:g('--warn')};
}
function destroyChart(n){ if(charts[n]){ charts[n].destroy(); delete charts[n]; } }
function mount(name, canvasId, emptyId, hasData, emptyKey, config){
  destroyChart(name);
  var canvas = $(canvasId), box = canvas.parentElement, empty = $(emptyId);
  if(typeof Chart === 'undefined'){ empty.textContent = t('chartsOff'); empty.hidden = false; box.hidden = true; return; }
  if(!hasData){ empty.textContent = t(emptyKey); empty.hidden = false; box.hidden = true; return; }
  empty.hidden = true; box.hidden = false;
  config.options = config.options || {};
  config.options.responsive = true;
  config.options.maintainAspectRatio = false;
  if(REDUCED) config.options.animation = false;
  charts[name] = new Chart(canvas, config);
}

function renderCharts(){
  var c = colors();
  if(typeof Chart !== 'undefined'){
    Chart.defaults.color = c.text;
    Chart.defaults.borderColor = c.grid;
    Chart.defaults.font.family = FONT;
  }
  var dates = periodDates();
  var labels = dates.map(fmtShort);
  var hasAny = dates.some(function(k){ return getDay(k); });

  // 1) خط: ساعات المراجعة يومياً
  mount('line','lineChart','emptyLine', hasAny, 'emptyChart', {
    type:'line',
    data:{labels:labels, datasets:[{
      label:t('hoursAxis'),
      data:dates.map(function(k){ return round2(dayMin(getDay(k))/60); }),
      borderColor:c.primary, backgroundColor:c.primary+'22', fill:true, tension:.3,
      pointRadius: dates.length > 40 ? 0 : 3
    }]},
    options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
  });

  // 2) أعمدة مكدّسة حسب المادة
  var groups, barLabels;
  if(distMode === 'week'){
    var w = lastDates(7); groups = w.map(function(k){ return [k]; }); barLabels = w.map(fmtShort);
  } else {
    var m = lastDates(28);
    groups = [0,1,2,3].map(function(i){ return m.slice(i*7, i*7+7); });
    barLabels = groups.map(function(g){ return fmtShort(g[0]); });
  }
  var datasets = state.subjects.map(function(s, i){
    return {
      label:subjName(s), stack:'s', borderRadius:3,
      backgroundColor:PALETTE[i % PALETTE.length],
      data:groups.map(function(g){
        return round2(g.reduce(function(a,k){ var d = getDay(k); return a + (d && d.m[s.id] || 0); }, 0)/60);
      })
    };
  });
  var barHas = datasets.some(function(ds){ return ds.data.some(function(v){ return v > 0; }); });
  mount('bar','barChart','emptyBar', barHas, 'emptyChart', {
    type:'bar', data:{labels:barLabels, datasets:datasets},
    options:{scales:{x:{stacked:true, grid:{display:false}}, y:{stacked:true, beginAtZero:true}},
             plugins:{legend:{position:'bottom'}}}
  });

  // 3) التركيز والطاقة
  var dualHas = dates.some(function(k){ var d = getDay(k); return d && (d.focus || d.energy); });
  mount('dual','dualChart','emptyDual', dualHas, 'emptyChart', {
    type:'line',
    data:{labels:labels, datasets:[
      {label:t('focus'), data:dates.map(function(k){ var d = getDay(k); return d && d.focus || null; }),
       borderColor:c.good, backgroundColor:'transparent', tension:.3, spanGaps:true},
      {label:t('energy'), data:dates.map(function(k){ var d = getDay(k); return d && d.energy || null; }),
       borderColor:c.warn, backgroundColor:'transparent', tension:.3, spanGaps:true}
    ]},
    options:{scales:{y:{min:0, max:5, ticks:{stepSize:1}}}, plugins:{legend:{position:'bottom'}}}
  });

  // 4) مبعثر: ساعات المراجعة مقابل التركيز
  var pts = [];
  dates.forEach(function(k){ var d = getDay(k); if(d && d.focus) pts.push({x:round2(dayMin(d)/60), y:d.focus}); });
  mount('scatter','scatterChart','emptyScatter', pts.length >= 2, 'emptyScatter', {
    type:'scatter',
    data:{datasets:[{label:t('focus'), data:pts, backgroundColor:c.primary, pointRadius:5}]},
    options:{plugins:{legend:{display:false}},
      scales:{x:{title:{display:true, text:t('hoursAxis')}, beginAtZero:true},
              y:{title:{display:true, text:t('focus')}, min:0, max:5, ticks:{stepSize:1}}}}
  });
}

/* ================= السجل ================= */
function renderHistory(){
  var list = $('historyList');
  list.textContent = '';
  var keys = Object.keys(state.days).sort().reverse().slice(0,30);
  if(!keys.length){ list.appendChild(el('div','empty', t('noHistory'))); return; }
  keys.forEach(function(k){
    var d = state.days[k];
    var item = el('div','history-item');
    var info = el('div','info');
    info.appendChild(el('div','date', fmtLong(k)));
    var meta = el('div','meta');
    meta.appendChild(el('span','', fmtDur(dayMin(d))));
    meta.appendChild(el('span','', t('focusShort')+' '+(d.focus || '–')));
    meta.appendChild(el('span','', t('energyShort')+' '+(d.energy || '–')));
    info.appendChild(meta);
    if(d.note) info.appendChild(el('div','note', d.note));
    item.appendChild(info);

    var act = el('div','actions');
    var eb = el('button','ghost-btn', t('edit')); eb.type = 'button';
    eb.addEventListener('click', function(){
      selectedDate = k; renderForm();
      $('formSection').scrollIntoView({behavior: REDUCED ? 'auto' : 'smooth', block:'start'});
    });
    var db = el('button','ghost-btn danger', t('del')); db.type = 'button';
    db.addEventListener('click', function(){
      if(!confirm(t('delDayConfirm', {d: fmtLong(k)}))) return;
      delete state.days[k]; saveState();
      if(k === selectedDate) renderForm();
      renderDashboard();
    });
    act.appendChild(eb); act.appendChild(db);
    item.appendChild(act);
    list.appendChild(item);
  });
}

function renderDashboard(){
  renderCountdown();
  renderSummary();
  renderCharts();
  renderHistory();
  $('examDateInput').value = state.examDate || '';
}

/* ================= الأحداث ================= */
function bindEvents(){
  $('langBtn').addEventListener('click', function(){
    state.lang = state.lang === 'ar' ? 'fr' : 'ar';
    saveState(); applyLang(); renderForm(); renderDashboard();
  });

  $('dateInput').addEventListener('change', function(e){
    var v = e.target.value;
    if(isKey(v) && v <= todayKey()){ selectedDate = v; }
    renderForm();
  });
  $('todayBtn').addEventListener('click', function(){ selectedDate = todayKey(); renderForm(); });

  $('noteInput').addEventListener('input', function(e){
    var v = e.target.value.slice(0,500).trim() ? e.target.value.slice(0,500) : '';
    var key = selectedDate;
    debounce('note', function(){
      var d = ensureDay(key); d.note = v; pruneDay(key); saveState(); renderHistory();
    }, 400);
  });
  $('saveBtn').addEventListener('click', function(){
    clearTimeout(timers.note);
    var v = $('noteInput').value.trim().slice(0,500);
    var d = ensureDay(selectedDate); d.note = v;
    pruneDay(selectedDate); saveState(); renderDashboard();
    toast(t('saved'));
  });
  $('addSubjectBtn').addEventListener('click', addSubject);

  $('periodFilter').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    document.querySelectorAll('#periodFilter .chip').forEach(function(c){ c.classList.remove('active'); });
    b.classList.add('active');
    currentPeriod = Number(b.getAttribute('data-days'));
    renderCharts();
  });
  $('distFilter').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    document.querySelectorAll('#distFilter .chip').forEach(function(c){ c.classList.remove('active'); });
    b.classList.add('active');
    distMode = b.getAttribute('data-dist');
    renderCharts();
  });

  $('examDateInput').addEventListener('change', function(e){
    state.examDate = isKey(e.target.value) ? e.target.value : null;
    saveState(); renderCountdown();
  });

  $('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'suivi-revision-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast(t('exported'));
  });
  $('importBtn').addEventListener('click', function(){ $('importFile').click(); });
  $('importFile').addEventListener('change', function(e){
    var file = e.target.files[0]; e.target.value = '';
    if(!file) return;
    if(file.size > 2*1024*1024){ toast(t('importFail')); return; }
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== 'object' || !parsed.days || typeof parsed.days !== 'object') throw new Error('bad');
        if(!confirm(t('importConfirm'))) return;
        state = sanitize(parsed, state.lang);
        saveState(); selectedDate = todayKey();
        applyLang(); renderForm(); renderDashboard();
        toast(t('imported'));
      }catch(err){ toast(t('importFail')); }
    };
    reader.onerror = function(){ toast(t('importFail')); };
    reader.readAsText(file);
  });
  $('resetBtn').addEventListener('click', function(){
    if(!confirm(t('resetConfirm'))) return;
    state = freshState(state.lang);
    saveState(); selectedDate = todayKey();
    applyLang(); renderForm(); renderDashboard();
    toast(t('resetDone'));
  });

  // عند تجاوز منتصف الليل أو العودة للتبويب
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    var tk = todayKey();
    if(tk !== lastToday){
      if(selectedDate === lastToday) selectedDate = tk;
      lastToday = tk; renderForm(); renderDashboard();
    }
  });
  // تغيير الوضع الداكن
  if(window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function(){ renderCharts(); };
    if(mq.addEventListener) mq.addEventListener('change', onScheme);
    else if(mq.addListener) mq.addListener(onScheme);
  }
}

/* ================= التشغيل ================= */
function init(){
  state = loadState();
  selectedDate = lastToday = todayKey();
  bindEvents();
  applyLang();
  renderForm();
  renderDashboard();
}
init();

})();
</script>
</body>
</html>
