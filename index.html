<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تتبع المراجعة والجدول الأسبوعي</title>
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f6f9; --bg-pattern:none; --card:#ffffff; --text:#1e293b; --muted:#64748b;
    --border:#e2e8f0; --primary:#2563eb; --primary-soft:rgba(37,99,235,0.12);
    --good:#16a34a; --bad:#dc2626; --warn:#d97706; --grid:rgba(100,116,139,.18);
    --shadow:0 4px 14px rgba(15,23,42,.05); --radius:16px;
    --font-scale:16px;
  }
  [data-theme="dark"]{
    --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
    --border:#334155; --primary:#3b82f6; --primary-soft:rgba(59,130,246,0.18);
    --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --grid:rgba(148,163,184,.18);
    --shadow:0 4px 14px rgba(0,0,0,.35);
  }
  [data-theme="sepia"]{
    --bg:#f4ecd8; --card:#fbf6ea; --text:#3b3126; --muted:#786855;
    --border:#e0d3b8; --primary:#b45309; --primary-soft:rgba(180,83,9,0.12);
    --good:#15803d; --bad:#b91c1c; --warn:#c2410c; --grid:rgba(120,104,85,.18);
    --shadow:0 4px 14px rgba(59,49,38,.06);
  }
  [data-bg-style="dots"]{
    background-image: radial-gradient(var(--border) 1.2px, transparent 1.2px);
    background-size: 20px 20px;
  }
  [data-bg-style="soft"]{
    background-image: linear-gradient(135deg, var(--bg) 0%, var(--primary-soft) 100%);
    background-attachment: fixed;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{font-size:var(--font-scale);-webkit-text-size-adjust:100%}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
    background-color:var(--bg); color:var(--text); line-height:1.65;
    padding:14px; padding-bottom:95px; transition:background-color .25s, color .25s;
  }
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--primary);outline-offset:2px}
  .wrap{max-width:1120px;margin:0 auto}

  /* الترويسة */
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
  h1{font-size:1.35rem;font-weight:800;letter-spacing:-0.01em}
  .sub{color:var(--muted);font-size:.82rem}
  .header-side{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .countdown{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:6px 14px;text-align:center;box-shadow:var(--shadow);min-width:105px;
  }
  .countdown b{display:block;font-size:1.45rem;color:var(--primary);line-height:1.15}
  .countdown span{font-size:.7rem;color:var(--muted);display:block}

  /* شريط التنقل بين الأقسام */
  .nav-tabs{
    display:flex;gap:8px;margin-bottom:16px;background:var(--card);
    padding:6px;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);
    overflow-x:auto;
  }
  .nav-tab{
    flex:1;min-width:110px;padding:10px 14px;border:none;border-radius:12px;
    background:transparent;font-weight:700;font-size:.88rem;cursor:pointer;
    color:var(--muted);transition:all .2s;white-space:nowrap;
  }
  .nav-tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px var(--primary-soft)}

  /* البطاقات العلوية */
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  @media(min-width:720px){.cards{grid-template-columns:repeat(4,1fr)}}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);
  }
  .card .lbl{font-size:.76rem;color:var(--muted)}
  .card .val{font-size:1.4rem;font-weight:800;margin-top:2px}
  .trend-up{color:var(--good);font-size:.75rem;font-weight:700}
  .trend-down{color:var(--bad);font-size:.75rem;font-weight:700}
  .trend-same{color:var(--muted);font-size:.75rem}

  /* الأقسام */
  .section{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .section-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .section h2{font-size:1.05rem;font-weight:800}

  /* شريط التوازن والأهداف الأسبوعية */
  .goals-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
  .goal-item{
    border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--bg);
  }
  .goal-top{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;margin-bottom:6px}
  .progress-bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden}
  .progress-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
  .progress-fill.done{background:var(--good)}
  .alert-box{
    background:var(--primary-soft);border-inline-start:4px solid var(--primary);
    padding:10px 14px;border-radius:10px;font-size:.84rem;margin-bottom:12px;
  }

  /* الجدول الأسبوعي */
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
  .sched-table{width:100%;border-collapse:collapse;min-width:780px;font-size:.8rem}
  .sched-table th,.sched-table td{
    border:1px solid var(--border);padding:8px 6px;text-align:center;vertical-align:middle;
  }
  .sched-table th{background:var(--bg);font-weight:800;color:var(--primary)}
  .sched-table th.today-col{background:var(--primary);color:#fff}
  .slot-time{font-weight:700;background:var(--bg);white-space:nowrap;font-size:.75rem;color:var(--muted)}
  .cell-subj{font-weight:800;display:block;font-size:.84rem}
  .cell-task{
    display:inline-block;margin-top:3px;padding:2px 7px;border-radius:6px;
    font-size:.7rem;background:var(--primary-soft);color:var(--primary);font-weight:600;
  }
  .cell-free{color:var(--muted);font-style:italic;font-size:.78rem}
  .cell-nat{background:rgba(22,163,74,0.14);color:var(--good)}
  .cell-exo{background:rgba(217,119,6,0.14);color:var(--warn)}

  /* الأزرار والمدخلات */
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{
    border:1px solid var(--border);background:transparent;
    padding:6px 14px;border-radius:999px;font-size:.8rem;cursor:pointer;font-weight:600;
  }
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .date-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  input[type=date], select, input[type=text]{
    padding:8px 11px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);
  }
  .badge{
    background:var(--primary-soft);color:var(--primary);border-radius:999px;
    padding:3px 12px;font-size:.78rem;font-weight:700;
  }

  .subject-row{
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;
    border:1px solid var(--border);margin-bottom:8px;flex-wrap:wrap;
  }
  .subject-row .name{flex:1 1 130px;font-weight:700;font-size:.9rem}
  .subject-row input[type=number]{
    width:72px;padding:7px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);text-align:center;font-weight:700;
  }
  .unit{color:var(--muted);font-size:.75rem}
  .quick{
    background:var(--primary-soft);color:var(--primary);border:none;border-radius:10px;
    padding:7px 10px;font-size:.8rem;font-weight:700;cursor:pointer;
  }
  .quick:active{transform:scale(.96)}
  .icon-btn{
    background:transparent;border:1px solid var(--border);border-radius:8px;
    padding:6px 9px;cursor:pointer;color:var(--muted);font-size:.8rem;
  }
  .icon-btn:hover{color:var(--primary);border-color:var(--primary)}
  .icon-btn.danger:hover{color:var(--bad);border-color:var(--bad)}
  .total-line{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;font-weight:800}

  .scale{display:flex;gap:6px;margin:6px 0 2px}
  .scale button{
    flex:1;min-width:42px;padding:10px 0;border-radius:12px;border:1px solid var(--border);
    background:var(--bg);font-weight:800;font-size:1rem;cursor:pointer;
  }
  .scale button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.85rem;font-weight:700;margin-bottom:5px}
  textarea{
    width:100%;min-height:64px;padding:10px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg);resize:vertical;
  }
  .primary-btn{
    width:100%;padding:13px;border-radius:14px;border:none;background:var(--primary);color:#fff;
    font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 4px 12px var(--primary-soft);
  }
  .primary-btn:active{opacity:.88}
  .ghost-btn{
    padding:8px 13px;border-radius:12px;border:1px solid var(--border);background:var(--card);
    font-size:.82rem;cursor:pointer;font-weight:600;
  }
  .ghost-btn:hover{border-color:var(--primary);color:var(--primary)}
  .ghost-btn.danger{color:var(--bad)}
  .ghost-btn.danger:hover{border-color:var(--bad)}

  /* الرسوم البيانية الخام */
  .charts{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:900px){.charts{grid-template-columns:1fr 1fr}}
  .charts .section{margin-bottom:0}
  .chart-box{position:relative;height:245px;width:100%}
  .chart-box canvas{width:100%;height:100%;display:block;cursor:crosshair}
  .chart-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;font-size:.76rem}
  .legend-item{display:flex;align-items:center;gap:5px}
  .legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .chart-tip{
    position:fixed;pointer-events:none;background:var(--text);color:var(--bg);
    padding:6px 10px;border-radius:8px;font-size:.76rem;font-weight:700;
    z-index:120;box-shadow:0 4px 12px rgba(0,0,0,.2);white-space:pre-line;
  }
  .empty{
    text-align:center;color:var(--muted);font-size:.85rem;padding:28px 8px;
    border:1px dashed var(--border);border-radius:12px;
  }

  /* السجل */
  .history-item{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;font-size:.85rem;
  }
  .history-item .info{flex:1;min-width:0}
  .history-item .date{font-weight:800}
  .history-item .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}
  .history-item .note{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .history-item .actions{display:flex;gap:6px}

  /* الإعدادات وتخصيص المظهر */
  .settings-grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:760px){.settings-grid{grid-template-columns:1fr 1fr}}
  .color-swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .swatch{
    width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;
  }
  .swatch.active{border-color:var(--text);transform:scale(1.1)}
  .plan-editor-row{
    display:grid;grid-template-columns:110px 1fr 1fr;gap:6px;align-items:center;
    padding:6px 0;border-bottom:1px solid var(--border);font-size:.82rem;
  }

  .row{display:flex;gap:8px;flex-wrap:wrap}
  .privacy{margin-top:12px;color:var(--muted);font-size:.78rem}
  footer{text-align:center;color:var(--muted);font-size:.74rem;margin-top:20px}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);
    background:var(--text);color:var(--bg);padding:10px 20px;border-radius:12px;
    font-size:.85rem;font-weight:700;transition:transform .3s;z-index:99;max-width:90vw;text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 data-i18n="appTitle"></h1>
      <div class="sub" data-i18n="tagline"></div>
    </div>
    <div class="header-side">
      <button class="ghost-btn" id="quickThemeBtn" type="button" title="تغيير المظهر">🌓</button>
      <button class="ghost-btn" id="langBtn" type="button"></button>
      <div class="countdown">
        <b id="countdownDays">—</b>
        <span id="countdownLbl"></span>
      </div>
    </div>
  </header>

  <!-- أشرطة التنقل -->
  <nav class="nav-tabs" role="tablist">
    <button class="nav-tab active" data-tab="tab-track" data-i18n="tabTrack"></button>
    <button class="nav-tab" data-tab="tab-plan" data-i18n="tabPlan"></button>
    <button class="nav-tab" data-tab="tab-stats" data-i18n="tabStats"></button>
    <button class="nav-tab" data-tab="tab-settings" data-i18n="tabSettings"></button>
  </nav>

  <!-- البطاقات الملخصة -->
  <div class="cards">
    <div class="card"><div class="lbl" data-i18n="lblToday"></div><div class="val" id="statToday">0</div></div>
    <div class="card"><div class="lbl" data-i18n="lblWeek"></div><div class="val" id="statWeek">0</div></div>
    <div class="card"><div class="lbl" data-i18n="lblFocus"></div><div class="val" id="statFocus">—</div></div>
    <div class="card">
      <div class="lbl" data-i18n="lblCompare"></div>
      <div class="val" id="statCompare">—</div>
      <div id="statTrend"></div>
    </div>
  </div>

  <!-- ================= التبويب 1: التسجيل اليومي ================= -->
  <div id="tab-track" class="tab-panel">
    <!-- تنبيه التوازن الأسبوعي -->
    <div class="section">
      <div class="section-head">
        <h2 data-i18n="balanceTitle"></h2>
        <span class="sub" data-i18n="balanceSub"></span>
      </div>
      <div id="balanceAlert" class="alert-box" hidden></div>
      <div class="goals-grid" id="weeklyGoalsGrid"></div>
    </div>

    <div class="section" id="formSection">
      <div class="section-head">
        <h2 data-i18n="logTitle"></h2>
        <button class="ghost-btn" id="autoFillPlanBtn" type="button" data-i18n="autoFillBtn"></button>
      </div>
      <div class="date-row">
        <label for="dateInput" class="sub" data-i18n="dateLbl"></label>
        <input type="date" id="dateInput">
        <button class="ghost-btn" id="todayBtn" type="button" data-i18n="backToday" hidden></button>
        <span class="badge" id="editBadge" hidden></span>
      </div>
      <div id="subjectInputs"></div>
      <div class="total-line">
        <button class="ghost-btn" id="addSubjectBtn" type="button" data-i18n="addSubject"></button>
        <span><span data-i18n="dayTotal"></span> <span id="dayTotal">0</span></span>
      </div>

      <div class="field">
        <label data-i18n="focusLbl"></label>
        <div class="scale" id="focusScale" role="group"></div>
      </div>
      <div class="field">
        <label data-i18n="energyLbl"></label>
        <div class="scale" id="energyScale" role="group"></div>
        <div class="sub" data-i18n="scaleHint" style="margin-top:4px"></div>
      </div>
      <div class="field">
        <label for="noteInput" data-i18n="noteLbl"></label>
        <textarea id="noteInput" maxlength="500" data-i18n-ph="notePh"></textarea>
      </div>
      <button class="primary-btn" id="saveBtn" type="button" data-i18n="saveDay"></button>
    </div>

    <div class="section">
      <h2 data-i18n="histTitle" style="margin-bottom:10px"></h2>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- ================= التبويب 2: البرنامج الأسبوعي ================= -->
  <div id="tab-plan" class="tab-panel" hidden>
    <div class="section">
      <div class="section-head">
        <div>
          <h2 data-i18n="planTitle"></h2>
          <div class="sub" data-i18n="planMethodNote"></div>
        </div>
        <button class="ghost-btn" id="goEditPlanBtn" type="button" data-i18n="editPlanShortcut"></button>
      </div>
      <div class="table-wrap" id="weeklyScheduleWrap"></div>
    </div>
  </div>

  <!-- ================= التبويب 3: الرسوم البيانية ================= -->
  <div id="tab-stats" class="tab-panel" hidden>
    <div class="filters" id="periodFilter">
      <button class="chip active" type="button" data-days="7" data-i18n="p7"></button>
      <button class="chip" type="button" data-days="30" data-i18n="p30"></button>
      <button class="chip" type="button" data-days="0" data-i18n="pAll"></button>
    </div>

    <div class="charts">
      <div class="section">
        <h2 data-i18n="ch1" style="margin-bottom:8px"></h2>
        <div class="chart-box"><canvas id="lineChart"></canvas></div>
        <div class="empty" id="emptyLine" hidden></div>
      </div>

      <div class="section">
        <h2 data-i18n="ch2" style="margin-bottom:8px"></h2>
        <div class="filters" id="distFilter">
          <button class="chip active" type="button" data-dist="week" data-i18n="distWeek"></button>
          <button class="chip" type="button" data-dist="month" data-i18n="distMonth"></button>
        </div>
        <div class="chart-box"><canvas id="barChart"></canvas></div>
        <div class="chart-legend" id="barLegend"></div>
        <div class="empty" id="emptyBar" hidden></div>
      </div>

      <div class="section">
        <h2 data-i18n="ch3" style="margin-bottom:8px"></h2>
        <div class="chart-box"><canvas id="dualChart"></canvas></div>
        <div class="chart-legend" id="dualLegend"></div>
        <div class="empty" id="emptyDual" hidden></div>
      </div>

      <div class="section">
        <h2 data-i18n="ch4" style="margin-bottom:8px"></h2>
        <div class="chart-box"><canvas id="scatterChart"></canvas></div>
        <div class="empty" id="emptyScatter" hidden></div>
      </div>
    </div>
  </div>

  <!-- ================= التبويب 4: الإعدادات وتخصيص الخطة والمظهر ================= -->
  <div id="tab-settings" class="tab-panel" hidden>
    <div class="settings-grid">
      <!-- تخصيص المظهر والراحة البصرية -->
      <div class="section">
        <h2 data-i18n="appearanceTitle" style="margin-bottom:12px"></h2>
        <div class="field">
          <label data-i18n="themeLbl"></label>
          <div class="filters" id="themeSelector">
            <button class="chip" type="button" data-val="light" data-i18n="themeLight"></button>
            <button class="chip" type="button" data-val="sepia" data-i18n="themeSepia"></button>
            <button class="chip" type="button" data-val="dark" data-i18n="themeDark"></button>
          </div>
        </div>
        <div class="field">
          <label data-i18n="bgStyleLbl"></label>
          <div class="filters" id="bgStyleSelector">
            <button class="chip" type="button" data-val="solid" data-i18n="bgSolid"></button>
            <button class="chip" type="button" data-val="dots" data-i18n="bgDots"></button>
            <button class="chip" type="button" data-val="soft" data-i18n="bgSoft"></button>
          </div>
        </div>
        <div class="field">
          <label data-i18n="accentLbl"></label>
          <div class="color-swatches" id="accentSwatches"></div>
        </div>
        <div class="field">
          <label data-i18n="fontSizeLbl"></label>
          <div class="filters" id="fontSizeSelector">
            <button class="chip" type="button" data-val="15" data-i18n="sizeSmall"></button>
            <button class="chip" type="button" data-val="16" data-i18n="sizeMed"></button>
            <button class="chip" type="button" data-val="18" data-i18n="sizeLarge"></button>
          </div>
        </div>
      </div>

      <!-- إعدادات الامتحان والبيانات -->
      <div class="section">
        <h2 data-i18n="settings" style="margin-bottom:12px"></h2>
        <div class="field">
          <label for="examDateInput" data-i18n="examDate"></label>
          <input type="date" id="examDateInput">
        </div>
        <div class="field">
          <label data-i18n="weeklyGoalsEditLbl"></label>
          <div id="goalsEditor"></div>
        </div>
        <div class="row" style="margin-top:14px">
          <button class="ghost-btn" id="exportBtn" type="button" data-i18n="exportBtn"></button>
          <button class="ghost-btn" id="importBtn" type="button" data-i18n="importBtn"></button>
          <button class="ghost-btn danger" id="resetBtn" type="button" data-i18n="resetBtn"></button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
        <p class="privacy" data-i18n="privacy"></p>
      </div>
    </div>

    <!-- محرر الخطة الأسبوعية -->
    <div class="section">
      <div class="section-head">
        <div>
          <h2 data-i18n="planEditorTitle"></h2>
          <div class="sub" data-i18n="planEditorSub"></div>
        </div>
        <div class="row">
          <select id="editDaySelect"></select>

function t(k, vars){
  var dict = I18N[state ? state.lang : 'ar'] || I18N.ar;
  var s = dict[k] !== undefined ? dict[k] : (I18N.ar[k] !== undefined ? I18N.ar[k] : k);

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('study_tracker_v2');
    if(!raw) return freshState();
    var p = JSON.parse(raw);
    var st = freshState();
    if(p.lang === 'ar' || p.lang === 'fr') st.lang = p.lang;
    if(['light','dark','sepia'].indexOf(p.theme) !== -1) st.theme = p.theme;
    if(['solid','dots','soft'].indexOf(p.bgStyle) !== -1) st.bgStyle = p.bgStyle;
    if(p.accent) st.accent = p.accent;
    if(['15','16','18'].indexOf(String(p.fontSize)) !== -1) st.fontSize = String(p.fontSize);
    if(Array.isArray(p.subjects) && p.subjects.length) st.subjects = p.subjects;
    if(p.goals && typeof p.goals === 'object') st.goals = Object.assign(st.goals, p.goals);
    if(p.weeklyPlan && typeof p.weeklyPlan === 'object') st.weeklyPlan = p.weeklyPlan;
    if(p.days && typeof p.days === 'object') st.days = p.days;
    if(p.examDate) st.examDate = p.examDate;
    return st;
  }catch(e){ return freshState(); }
}

function debounce(name, fn, ms){ clearTimeout(timers[name]); timers[name] = setTimeout(fn, ms); }

/* ================= التواريخ والأرقام ================= */
function pad(n){ return String(n).padStart(2,'0'); }
function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ var p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(k, n){ var d = parseKey(k); d.setDate(d.getDate()+n); return toKey(d); }
function todayKey(){ return toKey(new Date()); }
function daysBetween(a, b){ return Math.round((parseKey(b)-parseKey(a))/864e5); }
function isKey(k){ return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k); }
function lastDates(n){ var out = [], tk = todayKey(); for(var i=n-1;i>=0;i--) out.push(addDays(tk,-i)); return out; }
function periodDates(){
  if(currentPeriod > 0) return lastDates(currentPeriod);
  var keys = Object.keys(state.days).sort();
  if(!keys.length) return lastDates(7);
  var n = Math.min(Math.max(daysBetween(keys[0], todayKey()) + 1, 7), 180);
  return lastDates(n);
}
function fmtShort(k){ var p = k.split('-'); return p[2]+'/'+p[1]; }
function fmtLong(k){
  try{
    return parseKey(k).toLocaleDateString(state.lang === 'fr' ? 'fr-FR' : 'ar-MA-u-nu-latn',
      {weekday:'long', day:'numeric', month:'long'});
  }catch(e){ return k; }
}
function round2(n){ return Math.round(n*100)/100; }
function fmtDur(min){
  min = Math.round(min || 0);
  if(min < 60) return min + (state.lang === 'fr' ? ' min' : t('minShort'));
  var h = Math.floor(min/60), r = min % 60;
  return h + t('hU') + (r ? pad(r) : '');
}
function dayMin(d){
  if(!d || !d.m) return 0;
  var s = 0; for(var id in d.m) s += d.m[id] || 0; return s;
}
function getDay(k){ return state.days[k] || null; }
function ensureDay(k){ if(!state.days[k]) state.days[k] = {m:{}, focus:null, energy:null, note:''}; return state.days[k]; }
function pruneDay(k){
  var d = state.days[k];
  if(d && !Object.keys(d.m).length && !d.focus && !d.energy && !d.note) delete state.days[k];
}
function subjName(s){
  if(typeof s === 'string'){
    if(s === 'free') return t('subj_free');
    var found = state.subjects.find(function(x){ return x.id === s; });
    return found ? (found.name || t('subj_'+found.id)) : t('subj_'+s);
  }
  return s.name || t('subj_'+s.id);
}

  state.subjects.forEach(function(s){
    var goalH = Number(state.goals[s.id]) || 6;
    var curMin = totals[s.id] || 0;
    var curH = round2(curMin / 60);
    var pct = Math.min(100, Math.round((curH / goalH) * 100));
    var ratio = curH / goalH;
    if(ratio < lowestRatio && ratio < 0.85){
      lowestRatio = ratio;
      mostNeglected = {name: subjName(s), cur: fmtDur(curMin), goal: goalH + t('hU')};
    }

    var item = el('div','goal-item');
    var top = el('div','goal-top');
    top.appendChild(el('span','', subjName(s)));
    top.appendChild(el('span','', curH + ' / ' + goalH + t('hU')));
    item.appendChild(top);

    var bar = el('div','progress-bar');
    var fill = el('div','progress-fill' + (pct >= 100 ? ' done' : ''));
    fill.style.width = pct + '%';
    bar.appendChild(fill);
    item.appendChild(bar);
    grid.appendChild(item);
  });

  var alertBox = $('balanceAlert');
  alertBox.hidden = false;
  if(mostNeglected){
    alertBox.textContent = '⚠️ ' + t('neglectAlert', mostNeglected);
  } else {
    alertBox.textContent = '✅ ' + t('allBalanced');
  }
}

/* ================= محرك الرسوم البيانية الخام (Vanilla Canvas) ================= */
function getThemeColors(){
  var cs = getComputedStyle(document.documentElement);
  function g(n){ return cs.getPropertyValue(n).trim(); }
  return {
    text: g('--text'), muted: g('--muted'), grid: g('--grid'),
    primary: g('--primary'), good: g('--good'), warn: g('--warn'), card: g('--card')
  };
}

function setupCanvas(canvas){
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.parentElement.getBoundingClientRect();
  var w = Math.max(280, rect.width || 400);
  var h = Math.max(200, rect.height || 240);
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  return {ctx: ctx, w: w, h: h};
}

function drawGridAndAxes(ctx, w, h, padL, padR, padT, padB, maxY, steps, yLabels){
  var c = getThemeColors();
  var plotW = w - padL - padR, plotH = h - padT - padB;
  ctx.strokeStyle = c.grid;
  ctx.fillStyle = c.muted;
  ctx.font = '11px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';

  for(var i = 0; i <= steps; i++){
    var y = padT + plotH - (i / steps) * plotH;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    var lbl = yLabels ? yLabels[i] : round2((maxY / steps) * i);
    ctx.fillText(String(lbl), padL - 6, y);
  }
  return {plotW: plotW, plotH: plotH};
}

function renderLineCanvas(canvasId, emptyId, labels, values, color){
  var canvas = $(canvasId), box = canvas.parentElement, empty = $(emptyId);
  var hasData = values.some(function(v){ return v > 0; });
  if(!hasData){ empty.textContent = t('emptyChart'); empty.hidden = false; box.hidden = true; return; }
  empty.hidden = true; box.hidden = false;

  var s = setupCanvas(canvas), ctx = s.ctx, w = s.w, h = s.h;
  var padL = 36, padR = 14, padT = 16, padB = 26;
  var maxVal = Math.max(4, Math.ceil(Math.max.apply(null, values)));
  var g = drawGridAndAxes(ctx, w, h, padL, padR, padT, padB, maxVal, 4);
  var c = getThemeColors();
  var pts = [];

  ctx.textAlign = 'center';
  ctx.fillStyle = c.muted;
  var stepX = labels.length > 1 ? g.plotW / (labels.length - 1) : g.plotW / 2;

  values.forEach(function(v, i){
    var x = labels.length > 1 ? padL + i * stepX : padL + g.plotW / 2;
    var y = padT + g.plotH - (v / maxVal) * g.plotH;
    pts.push({x: x, y: y, label: labels[i], val: v + t('hU')});
    if(labels.length <= 10 || i % Math.ceil(labels.length / 7) === 0){
      ctx.fillText(labels[i], x, h - 10);
    }
  });

  // منطقة التظليل تحت الخط
  ctx.beginPath();
  pts.forEach(function(p, i){ if(i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.lineTo(pts[pts.length-1].x, padT + g.plotH);
  ctx.lineTo(pts[0].x, padT + g.plotH);
  ctx.closePath();
  ctx.fillStyle = color + '25';
  ctx.fill();

  // الخط الرئيسي
  ctx.beginPath();
  pts.forEach(function(p, i){ if(i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // النقاط
  pts.forEach(function(p){
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  });

  chartHoverData[canvasId] = pts;
}

function renderStackedBarCanvas(canvasId, emptyId, legendId, labels, datasets){
  var canvas = $(canvasId), box = canvas.parentElement, empty = $(emptyId), leg = $(legendId);
  var hasData = datasets.some(function(ds){ return ds.data.some(function(v){ return v > 0; }); });
  leg.textContent = '';
  if(!hasData){ empty.textContent = t('emptyChart'); empty.hidden = false; box.hidden = true; return; }
  empty.hidden = true; box.hidden = false;

  var s = setupCanvas(canvas), ctx = s.ctx, w = s.w, h = s.h;
  var padL = 36, padR = 14, padT = 16, padB = 26;
  var colTotals = labels.map(function(_, idx){
    return datasets.reduce(function(sum, ds){ return sum + (ds.data[idx] || 0); }, 0);
  });
  var maxVal = Math.max(4, Math.ceil(Math.max.apply(null, colTotals)));
  var g = drawGridAndAxes(ctx, w, h, padL, padR, padT, padB, maxVal, 4);
  var c = getThemeColors();
  var barSlot = g.plotW / labels.length;
  var barW = Math.min(34, barSlot * 0.62);
  var pts = [];

  labels.forEach(function(lbl, i){
    var x = padL + i * barSlot + (barSlot - barW) / 2;
    var curY = padT + g.plotH;
    var tipLines = [lbl];
    datasets.forEach(function(ds){
      var v = ds.data[i] || 0;
      if(v > 0){
        var barH = (v / maxVal) * g.plotH;
        curY -= barH;
        ctx.fillStyle = ds.color;
        ctx.fillRect(x, curY, barW, barH);
        tipLines.push(ds.label + ': ' + v + t('hU'));
      }
    });
    pts.push({x: x + barW/2, y: curY, label: tipLines.join('\n'), val: ''});
    ctx.fillStyle = c.muted;
    ctx.textAlign = 'center';
    ctx.fillText(lbl, x + barW/2, h - 10);
  });

  datasets.forEach(function(ds){
    var item = el('span','legend-item');
    var dot = el('span','legend-dot'); dot.style.background = ds.color;
    item.appendChild(dot); item.appendChild(el('span','', ds.label));
    leg.appendChild(item);
  });
  chartHoverData[canvasId] = pts;
}

function renderDualLineCanvas(canvasId, emptyId, legendId, labels, focusArr, energyArr){
  var canvas = $(canvasId), box = canvas.parentElement, empty = $(emptyId), leg = $(legendId);
  var hasData = focusArr.some(Boolean) || energyArr.some(Boolean);
  leg.textContent = '';
  if(!hasData){ empty.textContent = t('emptyChart'); empty.hidden = false; box.hidden = true; return; }
  empty.hidden = true; box.hidden = false;

  var s = setupCanvas(canvas), ctx = s.ctx, w = s.w, h = s.h;
  var padL = 32, padR = 14, padT = 16, padB = 26;
  var g = drawGridAndAxes(ctx, w, h, padL, padR, padT, padB, 5, 5, [0,1,2,3,4,5]);
  var c = getThemeColors();
  var stepX = labels.length > 1 ? g.plotW / (labels.length - 1) : g.plotW / 2;
  var pts = [];

  function drawSeries(arr, color){
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    var started = false;
    arr.forEach(function(v, i){
      var x = labels.length > 1 ? padL + i * stepX : padL + g.plotW / 2;
      if(v){
        var y = padT + g.plotH - (v / 5) * g.plotH;
        if(!started){ ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
    });
    ctx.stroke();
    arr.forEach(function(v, i){
      if(v){
        var x = labels.length > 1 ? padL + i * stepX : padL + g.plotW / 2;
        var y = padT + g.plotH - (v / 5) * g.plotH;
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
      }
    });
  }

  drawSeries(focusArr, c.good);
  drawSeries(energyArr, c.warn);

  labels.forEach(function(lbl, i){
    var x = labels.length > 1 ? padL + i * stepX : padL + g.plotW / 2;
    if(labels.length <= 10 || i % Math.ceil(labels.length / 7) === 0){
      ctx.fillStyle = c.muted; ctx.textAlign = 'center'; ctx.fillText(lbl, x, h - 10);
    }
    if(focusArr[i] || energyArr[i]){
      pts.push({
        x: x, y: padT + g.plotH/2,
        label: lbl + '\n' + t('focus') + ': ' + (focusArr[i]||'-') + '/5\n' + t('energy') + ': ' + (energyArr[i]||'-') + '/5',
        val: ''
      });
    }
  });

  [{lbl:t('focus'), col:c.good},{lbl:t('energy'), col:c.warn}].forEach(function(it){
    var item = el('span','legend-item');
    var dot = el('span','legend-dot'); dot.style.background = it.col;
    item.appendChild(dot); item.appendChild(el('span','', it.lbl));
    leg.appendChild(item);
  });
  chartHoverData[canvasId] = pts;
}

function renderScatterCanvas(canvasId, emptyId, points){
  var canvas = $(canvasId), box = canvas.parentElement, empty = $(emptyId);
  if(points.length < 2){ empty.textContent = t('emptyScatter'); empty.hidden = false; box.hidden = true; return; }
  empty.hidden = true; box.hidden = false;

  var s = setupCanvas(canvas), ctx = s.ctx, w = s.w, h = s.h;
  var padL = 36, padR = 16, padT = 16, padB = 26;
  var maxX = Math.max(4, Math.ceil(Math.max.apply(null, points.map(function(p){ return p.x; }))));
  var g = drawGridAndAxes(ctx, w, h, padL, padR, padT, padB, 5, 5, [0,1,2,3,4,5]);
  var c = getThemeColors();
  var pts = [];

  for(var xTick = 0; xTick <= maxX; xTick += Math.max(1, Math.floor(maxX/4))){
    var xx = padL + (xTick / maxX) * g.plotW;
    ctx.fillStyle = c.muted; ctx.textAlign = 'center';
    ctx.fillText(xTick + t('hU'), xx, h - 10);
  }

  points.forEach(function(p){
    var cx = padL + (p.x / maxX) * g.plotW;
    var cy = padT + g.plotH - (p.y / 5) * g.plotH;
    ctx.beginPath();
    ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = c.primary;
    ctx.fill();
    pts.push({x: cx, y: cy, label: p.x + t('hU') + ' • ' + t('focus') + ': ' + p.y + '/5', val: ''});
  });
  chartHoverData[canvasId] = pts;
}

function renderCharts(){
  var c = getThemeColors();
  var dates = periodDates();
  var labels = dates.map(fmtShort);

  renderLineCanvas('lineChart', 'emptyLine', labels, dates.map(function(k){ return round2(dayMin(getDay(k))/60); }), c.primary);

  if(distMode === 'week'){
    var w = lastDates(7); groups = w.map(function(k){ return [k]; }); barLabels = w.map(fmtShort);
  } else {

    barLabels = groups.map(function(g){ return fmtShort(g[0]); });

  var datasets = state.subjects.map(function(s, i){
    return {
      label: subjName(s),

        return round2(g.reduce(function(a,k){ var d = getDay(k); return a + (d && d.m[s.id] || 0); }, 0)/60);
      })

  renderStackedBarCanvas('barChart', 'emptyBar', 'barLegend', barLabels, datasets);

  renderDualLineCanvas('dualChart', 'emptyDual', 'dualLegend', labels,
    dates.map(function(k){ var d = getDay(k); return d && d.focus || null; }),

  var scPts = [];
  dates.forEach(function(k){ var d = getDay(k); if(d && d.focus) scPts.push({x: round2(dayMin(d)/60), y: d.focus}); });
  renderScatterCanvas('scatterChart', 'emptyScatter', scPts);
}

/* تفاعل التمرير على الرسوم البيانية */
function bindChartTooltips(){
  var tip = $('chartTip');
  ['lineChart','barChart','dualChart','scatterChart'].forEach(function(id){
    var canvas = $(id);
    canvas.addEventListener('mousemove', function(e){
      var pts = chartHoverData[id] || [];
      if(!pts.length){ tip.hidden = true; return; }
      var rect = canvas.getBoundingClientRect();
      var mx = e.clientX - rect.left, my = e.clientY - rect.top;
      var closest = null, minDist = 28;
      pts.forEach(function(p){
        var dist = Math.hypot(p.x - mx, p.y - my);
        if(dist < minDist){ minDist = dist; closest = p; }
      });
      if(closest){
        tip.textContent = closest.val ? (closest.label + ': ' + closest.val) : closest.label;
        tip.style.left = (e.clientX + 12) + 'px';
        tip.style.top = (e.clientY - 28) + 'px';
        tip.hidden = false;
      } else {
        tip.hidden = true;
      }
    });
    canvas.addEventListener('mouseleave', function(){ tip.hidden = true; });
  });
}

function setMinutes(id, v){
  var d = ensureDay(selectedDate);
  if(v > 0) d.m[id] = v; else delete d.m[id];
  pruneDay(selectedDate); saveState();
  $('dayTotal').textContent = fmtDur(dayMin(getDay(selectedDate)));
  debounce('dash', renderDashboard, 200);
}

function buildScale(wrapId, field){
  var wrap = $(wrapId); wrap.textContent = '';
  var d = getDay(selectedDate), cur = d ? d[field] : null;
  for(var i=1;i<=5;i++){
    (function(n){
      var b = el('button', n === cur ? 'active' : '', String(n));
      b.type = 'button';
      b.addEventListener('click', function(){
        var day = ensureDay(selectedDate);
        day[field] = day[field] === n ? null : n;
        pruneDay(selectedDate); saveState();
        buildScale(wrapId, field);
      });
      wrap.appendChild(b);
    })(i);
  }
}

function renderSummary(){
  $('statToday').textContent = fmtDur(dayMin(getDay(todayKey())));
  var wk = lastDates(7);
  var weekMin = wk.reduce(function(a,k){ return a + dayMin(getDay(k)); }, 0);
  $('statWeek').textContent = fmtDur(weekMin);

  var fs = wk.map(function(k){ var d = getDay(k); return d && d.focus; }).filter(Boolean);
  $('statFocus').textContent = fs.length ? String(round2(fs.reduce(function(a,b){ return a+b; }, 0)/fs.length)) : '—';

  var prev = lastDates(14).slice(0,7);
  var prevMin = prev.reduce(function(a,k){ return a + dayMin(getDay(k)); }, 0);
  var cmp = $('statCompare'), tr = $('statTrend');
  tr.textContent = ''; tr.className = '';
  if(!weekMin && !prevMin){ cmp.textContent = '—'; return; }
  cmp.textContent = fmtDur(weekMin);
  var diff = weekMin - prevMin;
  if(diff > 0){ tr.className = 'trend-up'; tr.textContent = '\u25B2 ' + t('trendUp', {x: fmtDur(diff)}); }
  else if(diff < 0){ tr.className = 'trend-down'; tr.textContent = '\u25BC ' + t('trendDown', {x: fmtDur(-diff)}); }
  else { tr.className = 'trend-same'; tr.textContent = t('trendSame'); }
}

    var act = el('div','actions');

    eb.addEventListener('click', function(){

    });

      if(k === selectedDate) renderForm();
      renderDashboard();
    });
    act.appendChild(eb); act.appendChild(db);
    item.appendChild(act);
    list.appendChild(item);
  });
}

function renderSettingsControls(){
  var swWrap = $('accentSwatches'); swWrap.textContent = '';
  ACCENTS.forEach(function(col){
    var b = el('button','swatch' + (state.accent === col ? ' active' : ''));
    b.type = 'button'; b.style.background = col; b.setAttribute('data-color', col);
    b.addEventListener('click', function(){
      state.accent = col; saveState(); applyAppearance(); renderCharts();
    });
    swWrap.appendChild(b);
  });

  var gEdit = $('goalsEditor'); gEdit.textContent = '';
  state.subjects.forEach(function(s){
    var row = el('div','subject-row');
    row.appendChild(el('span','name', subjName(s)));
    var inp = el('input'); inp.type = 'number'; inp.min = 1; inp.max = 60;
    inp.value = state.goals[s.id] || 6;
    inp.addEventListener('change', function(){
      state.goals[s.id] = Math.max(1, Number(inp.value) || 6);
      saveState(); renderWeeklyBalance();
    });
    row.appendChild(inp);
    row.appendChild(el('span','unit', t('hU')));
    gEdit.appendChild(row);
  });
}

function renderDashboard(){
  // العد التنازلي
  if(!state.examDate){ $('countdownDays').textContent = '—'; $('countdownLbl').textContent = t('countdownUnset'); }
  else { $('countdownDays').textContent = Math.max(0, daysBetween(todayKey(), state.examDate)); $('countdownLbl').textContent = t('countdownLbl'); }

  renderSummary();
  renderWeeklyBalance();
  renderWeeklySchedule();
  renderHistory();
  renderCharts();
  $('examDateInput').value = state.examDate || '';
}

/* ================= ربط الأحداث ================= */
function bindEvents(){
  // التنقل بين التبويبات
  document.querySelectorAll('.nav-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.nav-tab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      var target = btn.getAttribute('data-tab');
      document.querySelectorAll('.tab-panel').forEach(function(p){ p.hidden = p.id !== target; });
      if(target === 'tab-stats') setTimeout(renderCharts, 30);
    });
  });

  $('goEditPlanBtn').addEventListener('click', function(){
    document.querySelector('[data-tab="tab-settings"]').click();
    $('planEditorContainer').scrollIntoView({behavior:'smooth'});
  });

  $('quickThemeBtn').addEventListener('click', function(){
    var order = ['light','sepia','dark'];
    state.theme = order[(order.indexOf(state.theme) + 1) % order.length];
    saveState(); applyAppearance(); renderCharts();
  });

  $('langBtn').addEventListener('click', function(){
    state.lang = state.lang === 'ar' ? 'fr' : 'ar';
    $('editDaySelect').innerHTML = '';
    saveState(); applyLang(); renderForm(); renderPlanEditor(); renderDashboard();
  });

  $('autoFillPlanBtn').addEventListener('click', autoFillFromPlan);

  $('dateInput').addEventListener('change', function(e){
    if(isKey(e.target.value) && e.target.value <= todayKey()) selectedDate = e.target.value;
    renderForm();
  });
  $('todayBtn').addEventListener('click', function(){ selectedDate = todayKey(); renderForm(); });

  $('saveBtn').addEventListener('click', function(){
    var d = ensureDay(selectedDate);
    d.note = $('noteInput').value.trim().slice(0,500);
    pruneDay(selectedDate); saveState(); renderDashboard();
    toast(t('saved'));
  });

  $('addSubjectBtn').addEventListener('click', function(){
    if(state.subjects.length >= MAX_SUBJECTS){ toast(t('subjectLimit', {n: MAX_SUBJECTS})); return; }
    var v = prompt(t('newSubjectPrompt'));
    if(!v || !v.trim()) return;
    v = v.trim().slice(0,40);
    var id = 'c' + Date.now().toString(36);
    state.subjects.push({id: id, name: v});
    state.goals[id] = 6;
    saveState(); renderForm(); renderSettingsControls(); renderPlanEditor(); renderDashboard();
  });

  // إعدادات المظهر
  $('themeSelector').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    state.theme = b.getAttribute('data-val'); saveState(); applyAppearance(); renderCharts();
  });
  $('bgStyleSelector').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    state.bgStyle = b.getAttribute('data-val'); saveState(); applyAppearance();
  });
  $('fontSizeSelector').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    state.fontSize = b.getAttribute('data-val'); saveState(); applyAppearance();
  });

  $('editDaySelect').addEventListener('change', renderPlanEditor);
  $('resetPlanBtn').addEventListener('click', function(){
    state.weeklyPlan = defaultWeeklyPlan();
    saveState(); renderPlanEditor(); renderWeeklySchedule();
    toast(t('planResetDone'));
  });

  $('periodFilter').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    document.querySelectorAll('#periodFilter .chip').forEach(function(c){ c.classList.remove('active'); });
    b.classList.add('active');
    currentPeriod = Number(b.getAttribute('data-days'));
    renderCharts();
  });
  $('distFilter').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    document.querySelectorAll('#distFilter .chip').forEach(function(c){ c.classList.remove('active'); });
    b.classList.add('active');
    distMode = b.getAttribute('data-dist');
    renderCharts();
  });

  $('examDateInput').addEventListener('change', function(e){
    state.examDate = isKey(e.target.value) ? e.target.value : null;
    saveState(); renderDashboard();
  });

  $('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'suivi-bac-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast(t('exported'));
  });
  $('importBtn').addEventListener('click', function(){ $('importFile').click(); });
  $('importFile').addEventListener('change', function(e){
    var file = e.target.files[0]; e.target.value = '';
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var p = JSON.parse(reader.result);
        if(!p || !p.days || !confirm(t('importConfirm'))) return;
        state = Object.assign(freshState(), p);
        saveState(); applyAppearance(); applyLang(); renderSettingsControls(); renderPlanEditor(); renderForm(); renderDashboard();
        toast(t('imported'));
      }catch(err){ toast(t('importFail')); }
    };
    reader.readAsText(file);
  });
  $('resetBtn').addEventListener('click', function(){
    if(!confirm(t('resetConfirm'))) return;
    state = freshState(); saveState();
    applyAppearance(); applyLang(); renderSettingsControls(); renderPlanEditor(); renderForm(); renderDashboard();
    toast(t('resetDone'));
  });

  window.addEventListener('resize', function(){ debounce('resize', renderCharts, 200); });
  bindChartTooltips();
}

/* ================= التشغيل ================= */
state = loadState();
selectedDate = lastToday = todayKey();
bindEvents();
applyAppearance();
applyLang();
renderSettingsControls();
renderPlanEditor();
renderForm();
renderDashboard();

})();
</script>
</body>
</html>
